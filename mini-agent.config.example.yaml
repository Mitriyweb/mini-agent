# mini-agent configuration example

logging:
  level: normal # off | normal | verbose

cost_tracking:
  enabled: false
  currency: USD

  # Optional default pricing for unknown models
  pricing:
    input_per_1m_tokens: 0
    output_per_1m_tokens: 0

  # Model-specific pricing overrides per 1 million tokens
  models:
    model-router-auto:
      input_per_1m_tokens: 1.0
      output_per_1m_tokens: 3.0
    gpt-4o:
      input_per_1m_tokens: 2.5
      output_per_1m_tokens: 10.0
    claude-3-5-sonnet-20241022:
      input_per_1m_tokens: 3.0
      output_per_1m_tokens: 15.0

skills:
  enabled: true
  allow:
    - git
    - code-review
  deny:
    - dangerous-skill

system_prompt:
  enabled: true
  path: "" # Optional custom system prompt path (e.g. "./prompts/custom-system.md")

# Retry policy for transient LLM errors
retry:
  enabled: true
  maxAttempts: 3                # Number of retry attempts for transient errors
  initialDelayMs: 1000          # Initial backoff delay in milliseconds
  backoffFactor: 2              # Exponential backoff multiplier (delay doubles each attempt)
  maxDelayMs: 30000             # Maximum delay between retries (caps exponential growth)

# Note: --retry-attempts <n> (CLI) controls maxAttempts for this agent run only.
# Distinct from --max-retries <n> (OpenSpec tool retries on permanent failures).

