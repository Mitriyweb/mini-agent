# mini-agent configuration example
#
# Copy to one of:
#   ~/.config/mini-agent/mini-agent.config.yaml   (user-level defaults; honors XDG_CONFIG_HOME)
#   <workspace>/mini-agent.config.yaml            (workspace overrides)
#
# User-level and workspace files merge section-by-section, with workspace
# values winning per key. A file passed with --config replaces only the
# workspace layer. `logging.level: off` suppresses log noise but still prints
# assistant responses and final task output.

logging:
  level: normal # off | normal | verbose

cost_tracking:
  enabled: false
  currency: USD

  # Optional default pricing for unknown models
  pricing:
    input_per_1m_tokens: 0
    output_per_1m_tokens: 0

  # Model-specific pricing overrides per 1 million tokens
  models:
    model-router-auto:
      input_per_1m_tokens: 1.0
      output_per_1m_tokens: 3.0
    gpt-4o:
      input_per_1m_tokens: 2.5
      output_per_1m_tokens: 10.0
    claude-3-5-sonnet-20241022:
      input_per_1m_tokens: 3.0
      output_per_1m_tokens: 15.0

skills:
  enabled: true
  allow:
    - git
    - code-review
  deny:
    - dangerous-skill

system_prompt:
  enabled: true
  path: "" # Optional custom system prompt path (e.g. "./prompts/custom-system.md")

# Retry policy for transient LLM errors
retry:
  enabled: true
  maxAttempts: 3                # Number of retry attempts for transient errors
  initialDelayMs: 1000          # Initial backoff delay in milliseconds
  backoffFactor: 2              # Exponential backoff multiplier (delay doubles each attempt)
  maxDelayMs: 30000             # Maximum delay between retries (caps exponential growth)

# Note: --retry-attempts <n> (CLI) controls maxAttempts for this agent run only.
# Distinct from --max-retries <n> (OpenSpec tool retries on permanent failures).

# Permission mode: normal (default) prompts for sensitive tool calls;
# bypass (aliases: yolo, dangerous) auto-approves all prompts and skips
# quality gates. Deny rules and workspace containment still apply.
permission_mode: normal

# Child-agent delegation (opt-in, disabled by default)
subagents:
  enabled: false                # Set true to enable the delegate tool
  max_concurrency: 4            # Max child tasks running at once per delegate call
  max_steps: 30                 # Default per-child step limit
  allow_nested: false           # Allow write-capable children to delegate further

# Top-level runtime options (all optional; env vars and CLI flags override these)
# provider: router               # Built-in provider id or a custom `providers:` id
# model: model-router-auto       # Model id for the selected provider
# baseURL: ""                    # OpenAI-compatible base URL override
# max_steps: 30                  # Max agent steps per run
# auto_approve: false            # Auto-approve tool calls (prefer permission_mode)

# External review (opt-in, disabled by default)
external_review:
  enabled: false
  authorized_provider: ""       # Optional provider id allowed to run reviews
  retries:
    maxAttempts: 3
    initialDelayMs: 1000
    backoffFactor: 2

# Custom providers: arbitrary OpenAI-compatible endpoints.
# See README "Custom Providers" for the full field reference.
providers:
  llmlite:
    name: LLM Lite
    baseURL: https://llmlite.example.com/v1
    apiKeyEnvVar: LLMLITE_API_KEY
    defaultModel: auto
    fallbackModels: []
    models:
      type: openai-compatible   # openai-compatible | endpoint | static

# Quality gates run after agent tasks (opt-in, disabled by default)
quality_gates:
  enabled: false
  gates:
    - id: lint
      name: Lint
      command: bun run lint
      required: true
      timeout_ms: 120000

