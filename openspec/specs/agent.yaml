openapi: 3.0.0
info:
  title: mini-agent Core & Subsystems Specification
  version: 0.1.15
  description: Architectural specifications for mini-agent core modules including permissions, workspace, LLM providers, usage tracking, skills, system prompt, and REPL/CLI loop.
paths:
  /agent/loop:
    post:
      summary: Stepwise agent iteration execution
      description: Orchestrates message history, tool invocation, token truncation, and max step control.
      responses:
        '200':
          description: Completed agent result with final response text and token usage summary.
  /agent/workspace:
    get:
      summary: Workspace boundary enforcement
      description: Resolves and verifies existing/new file paths within git root & workspace root.
      responses:
        '200':
          description: Safe workspace path or access rejection.
  /agent/permissions:
    post:
      summary: Security permission rule evaluation
      description: Evaluates deny > allow exact > allow mask precedence and prompts for command execution when needed.
      responses:
        '200':
          description: Permission evaluation decision (ALLOW / DENY).
  /agent/providers:
    get:
      summary: LLM Provider resolution and registry
      description: Discovers dynamic models and constructs clients for Router, OpenAI, Anthropic, and Google Gemini endpoints.
      responses:
        '200':
          description: LLM Provider instance ready for completion calls.
  /agent/usage:
    get:
      summary: Token accounting and cost calculation
      description: Tracks prompt/completion token consumption and calculates running cost estimates per model.
      responses:
        '200':
          description: Detailed token usage summary and aggregate cost metrics.
  /agent/skills:
    get:
      summary: Agent skill filtering & catalog resolution
      description: Resolves skills from .agents/skills following configuration allow/deny rules.
      responses:
        '200':
          description: Filtered skill metadata catalog for agent prompt context.
  /agent/system-prompt:
    get:
      summary: System prompt and instruction resolution
      description: Merges base instructions, customization prompts, and coding standards.
      responses:
        '200':
          description: Effective system prompt string.
