openapi: 3.0.0
info:
  title: mini-agent Agent Domain OpenSpec
  version: 0.1.15
  description: OpenAPI 3.0 specification for mini-agent agent loop and prompt resolution.
paths:
  /agent/run:
    post:
      summary: Execute agent task loop
      description: Runs the agent loop with task, provider options, permissions, and step limits.
      responses:
        '200':
          description: Agent completed task successfully.
  /agent/instructions:
    get:
      summary: Resolve effective system instructions
      description: Returns merged system prompt and customization catalog.
      responses:
        '200':
          description: Effective instruction text.
